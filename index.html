<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZT日報DX 2.0</title><meta name="referrer" content="no-referrer">
<style>
:root{font-family:system-ui,sans-serif;color:#153042;background:#f1f5f6}*{box-sizing:border-box}body{margin:0}header{background:#123b43;color:white;padding:24px}main{max-width:780px;margin:auto;padding:20px}h1{font-size:23px;margin:0 0 6px}h2{font-size:19px}section{background:white;border-radius:16px;padding:22px;margin-bottom:18px;border:1px solid #dce5e6}label{display:block;margin:16px 0 7px;font-weight:600}input,select,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #b7c7cd;max-width:100%}input:not([type=checkbox]),select{width:100%}button{cursor:pointer;background:#126b69;color:white;border:0;margin:5px 4px 5px 0}button.secondary{background:#e8f0f1;color:#153042}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.members{display:flex;flex-wrap:wrap;gap:8px}.members label{background:#edf4f4;padding:12px;border-radius:8px;margin:0;font-weight:400}.note{color:#536a76;font-size:14px}.row{border-top:1px solid #dde6e8;padding:14px 0}.badge{color:#126b69;font-weight:700}#message{white-space:pre-wrap;padding:14px;min-height:48px}#message.error{color:#ab2424}pre{white-space:pre-wrap;word-break:break-word;background:#f2f5f6;padding:12px}nav{margin:14px 0}summary{cursor:pointer} @media(max-width:480px){main{padding:12px}section{padding:16px}.grid{gap:10px}}
</style></head><body>
<header><h1>ZT日報DX <small>2.0</small></h1><div id="company">パートナー会社専用・代表者入力</div></header>
<main><div id="message" role="status" aria-live="polite">LINE認証を確認しています…</div>
<div id="app" hidden><nav><button class="secondary" onclick="newReport()">新規日報</button><button class="secondary" onclick="load()">履歴を再読込</button><button class="secondary" onclick="logout()">ログアウト</button></nav>
<section><h2>月間集計・日報履歴</h2><label for="month">対象月（勤務開始日基準）</label><input id="month" type="month" onchange="load()"><p id="totals" class="badge"></p><div id="history"></div></section>
<section id="entry"><h2 id="heading">日報を登録</h2><form id="form">
<label for="date">勤務開始日</label><input id="date" type="date" required>
<label>氏名（複数選択）</label><div id="members" class="members"></div>
<label for="site">現場名</label><input id="site" maxlength="100" required placeholder="現場名を入力">
<div class="grid"><div><label for="units">1人あたりの人工</label><select id="units"></select></div><div><label for="shift">勤務区分</label><select id="shift" onchange="shiftChanged()"><option value="day">日勤</option><option value="night">夜勤</option></select></div></div>
<p class="note">選択した全員に同じ人工を適用します。人工が異なる場合は別の日報に分けて登録してください。</p>
<div class="grid"><div><label for="start">始業（24時間）</label><select id="start"></select></div><div><label for="end">終業（24時間）</label><select id="end"></select></div></div>
<label for="endDayOffset">終業日</label><select id="endDayOffset"><option value="0">勤務開始日と同日</option><option value="1">勤務開始日の翌日（夜勤）</option></select>
<div id="reasonBox" hidden><label for="reason">修正理由</label><input id="reason" maxlength="200"></div>
<p id="estimate" class="badge"></p><button id="save" type="submit">登録する</button><button type="button" class="secondary" onclick="newReport()">入力をリセット</button>
</form></section></div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script>
const {LIFF_ID,API_URL}=window.ZT_CONFIG||{};
const $=id=>document.getElementById(id);let state=null,editing=null,pending=null,busy=false;
function msg(t,error=false){$('message').textContent=t;$('message').className=error?'error':'';}
// Re-login: inside LINE re-open refreshes the ID token; in an external browser use liff.login.
function relogin(){if(liff.isInClient())location.reload();else liff.login({redirectUri:location.href.split('#')[0]});}
// text/plain avoids a CORS preflight, which GAS web apps do not answer.
async function rpc(action,...args){
 let res;try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:token(),args}),redirect:'follow'});}catch(e){throw Error('通信に失敗しました。電波状況を確認して再送してください');}
 let r;try{r=await res.json();}catch(e){throw Error('サーバー応答を読めませんでした（API設定をご確認ください）');}
 if(!r.ok){if(r.code==='AUTH'){msg('ログインの有効期限が切れました。再ログインします…',true);relogin();}throw Error(r.error||'エラーが発生しました');}
 return r.data;
}
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());}
function token(){const t=liff.getIDToken(),d=liff.getDecodedIDToken();if(!t||!d||d.exp*1000<Date.now()+60000){relogin();throw Error('再ログインしています…');}return t;}
function option(value,text){const o=document.createElement('option');o.value=value;o.textContent=text;return o;}
async function load(){if(busy)return;busy=true;$('save').disabled=true;try{state=await rpc('bootstrap',$('month').value);$('company').textContent=state.companyName+'｜代表者専用';$('app').hidden=false;render();newReport();msg('履歴を読み込みました。');}catch(e){msg(e.message,true);}finally{busy=false;$('save').disabled=false;}}
function render(){
 const selected=[...$('members').querySelectorAll(':checked')].map(x=>x.value);$('members').replaceChildren();
 state.members.forEach(m=>{const label=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=m.id;i.checked=selected.includes(m.id);i.onchange=estimate;label.append(i,document.createTextNode(' '+m.name));$('members').append(label);});
 $('units').replaceChildren(...state.unitChoices.map(v=>option(v,v+'人工')));
 const s=state.summary;$('totals').textContent=s.units+'人工 ／ '+(s.unpriced?'金額未確定（単価未設定 '+s.unpriced+'件・設定済分 '+s.knownAmount.toLocaleString()+'円）':s.knownAmount.toLocaleString()+'円');
 $('history').replaceChildren();if(!state.reports.length)$('history').textContent='この月の日報はありません。';
 state.reports.sort((a,b)=>b.after.date.localeCompare(a.after.date)).forEach(e=>{const d=document.createElement('div');d.className='row';const p=document.createElement('p');const r=e.after;p.textContent=r.date+'｜'+r.site+'｜'+(r.shift==='night'?'夜勤':'日勤')+'｜'+r.totalUnits+'人工';const names=document.createElement('p');names.className='note';names.textContent=r.members.map(m=>m.name).join('・')+' ／ '+r.start+'〜'+(r.endDayOffset?'翌日 ':'')+r.end;const status=document.createElement('p');status.className='note';status.textContent='通知：'+e.notificationStatus;const b=document.createElement('button');b.className='secondary';b.textContent='編集';b.onclick=()=>edit(e);const audit=document.createElement('details'),sum=document.createElement('summary');sum.textContent='修正履歴（'+e.revision+'版）';audit.append(sum);state.revisions.filter(x=>x.id===e.id).forEach(x=>{const pre=document.createElement('pre');pre.textContent=JSON.stringify({版:x.revision,日時:x.at,操作代表者:x.actor,理由:x.reason,修正前:x.before,修正後:x.after},null,2);audit.append(pre);});d.append(p,names,status,b,audit);$('history').append(d);});
}
function newReport(){editing=null;pending=null;$('form').reset();$('date').value=today();$('units').value=state?.unitChoices.includes(1)?1:state?.unitChoices[0];$('start').value='08:00';$('end').value='17:00';$('heading').textContent='日報を登録';$('save').textContent='登録する';$('reasonBox').hidden=true;$('reason').required=false;shiftChanged();estimate();}
function shiftChanged(){const night=$('shift').value==='night';$('endDayOffset').options[1].disabled=!night;if(!night)$('endDayOffset').value='0';estimate();}
function edit(e){newReport();editing=e;const r=e.after;['date','site','shift','units','start','end','endDayOffset'].forEach(k=>$(k).value=r[k]);const ids=r.members.map(m=>m.id);$('members').querySelectorAll('input').forEach(i=>i.checked=ids.includes(i.value));$('heading').textContent='日報を修正（第'+e.revision+'版）';$('save').textContent='修正を保存';$('reasonBox').hidden=false;$('reason').required=true;shiftChanged();estimate();$('entry').scrollIntoView({behavior:'smooth'});if(ids.some(id=>!state.members.some(m=>m.id===id)))msg('退会済みの氏名があります。現在の登録氏名で選び直してください。',true);}
function estimate(){const count=$('members').querySelectorAll(':checked').length;$('estimate').textContent='合計 '+Math.round(count*Number($('units').value)*100)/100+'人工（'+count+'名）';}
$('units').onchange=estimate;
$('form').onsubmit=async ev=>{ev.preventDefault();if(busy)return;busy=true;$('save').disabled=true;
 try{const p={};['date','site','shift','units','start','end','endDayOffset','reason'].forEach(k=>p[k]=$(k).value);p.memberIds=[...$('members').querySelectorAll(':checked')].map(i=>i.value);if(editing){p.id=editing.id;p.revision=editing.revision;}
 const fingerprint=JSON.stringify(p);if(pending&&pending.fingerprint!==fingerprint)throw Error('前の送信結果を確認できていません。入力を元に戻して再送するか、履歴を再読込して確認してください。');if(!pending)pending={fingerprint,id:crypto.randomUUID()};p.requestId=pending.id;
 const result=await rpc('saveReport',p);pending=null;msg('保存しました。'+(result.notification||''));busy=false;await load();msg('保存しました。LINE通知は別処理で送信します。');
 }catch(e){msg(e.message,true);}finally{busy=false;$('save').disabled=false;}};
function logout(){liff.logout();$('app').hidden=true;state=null;msg('ログアウトしました。LINEから開き直してください。');}
for(let h=0;h<24;h++)for(let m=0;m<60;m++){const t=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');$('start').append(option(t,t));$('end').append(option(t,t));}
$('month').value=today().slice(0,7);
(async()=>{try{if(!LIFF_ID||!API_URL)throw Error('LIFF IDまたはAPI URLが未設定です。管理者にご確認ください。');await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return;}await load();}catch(e){msg(e.message,true);}})();
</script></body></html>
